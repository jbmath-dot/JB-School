name: Validate demo
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check src/core.js
      - run: node --check src/app.js
      - run: node --check src/modules-core.js
      - run: node --check src/modules-ui.js
      - run: node --test tests/*.test.cjs
