name: Build 학급관리 APK
on:
  push:
    branches: [feature/class-manager-apk-20261107]
    paths:
      - 'class-manager-apk/**'
      - '.github/workflows/class-manager-apk.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -path '*/bin/sdkmanager' -type f | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile APK
        working-directory: class-manager-apk
        run: gradle --no-daemon assembleDebug assemblePreview
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClassManager-APK
          path: class-manager-apk/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Upload safe side-by-side theme preview
        uses: actions/upload-artifact@v4
        with:
          name: ClassManager-ThemePreview-APK
          path: class-manager-apk/app/build/outputs/apk/preview/app-preview.apk
          retention-days: 30
