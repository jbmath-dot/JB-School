plugins { id 'com.android.application' }

// DO NOT put private keys or passwords in a public repository.
// A signed update requires the *original* keystore and passwords, injected via
// environment variables (GitHub Actions encrypted repository secrets).
def signedKeystorePath = System.getenv('CM_SIGNING_KEYSTORE_PATH')
def signedStorePassword = System.getenv('CM_SIGNING_STORE_PASSWORD')
def signedKeyAlias = System.getenv('CM_SIGNING_KEY_ALIAS')
def signedKeyPassword = System.getenv('CM_SIGNING_KEY_PASSWORD')
def signedStoreType = System.getenv('CM_SIGNING_STORE_TYPE')
def hasSigningCredentials = [signedKeystorePath, signedStorePassword, signedKeyAlias, signedKeyPassword]
    .every { it != null && it.length() > 0 }

def signedBuildNumber = System.getenv('CM_SIGNED_VERSION_CODE')
if (signedBuildNumber != null && !(signedBuildNumber ==~ /[0-9]{1,9}/)) {
    throw new GradleException('Invalid signed release versionCode; expected a positive integer.')
}
def wantsRelease = gradle.startParameter.taskNames.any { it.toLowerCase(java.util.Locale.ROOT).contains('release') }
if (wantsRelease && !hasSigningCredentials) {
    throw new GradleException('Release signing not configured. Refusing to produce an update APK with a new/random debug key. Supply the original keystore via CM_SIGNING_* environment variables.')
}

android {
  namespace 'kr.jbmath.classmanager'
  compileSdk 35
  defaultConfig {
    applicationId 'kr.jbmath.classmanager'
    minSdk 23
    targetSdk 35
    versionCode (signedBuildNumber != null ? Integer.parseInt(signedBuildNumber) : 5)
    versionName (signedBuildNumber != null ? '1.3.3.' + signedBuildNumber : '1.3.3')
    manifestPlaceholders = [appLabel: '학급관리']
  }
  signingConfigs {
    if (hasSigningCredentials) {
      stableUpdate {
        storeFile file(signedKeystorePath)
        storePassword signedStorePassword
        keyAlias signedKeyAlias
        keyPassword signedKeyPassword
        if (signedStoreType != null && signedStoreType.length() > 0) {
          storeType signedStoreType
        }
      }
    }
  }
  buildTypes {
    release {
      // Never fall back to signing with the ephemeral debug key.
      if (hasSigningCredentials) {
        signingConfig signingConfigs.stableUpdate
      }
      minifyEnabled false
    }
    preview {
      initWith debug
      applicationIdSuffix '.preview'
      versionNameSuffix '-preview'
      manifestPlaceholders = [appLabel: '학급관리 테마 미리보기']
      matchingFallbacks = ['debug']
    }
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}
dependencies {
  implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
  implementation 'com.google.mlkit:text-recognition-korean:16.0.1'
  implementation 'androidx.core:core:1.13.1'
}
